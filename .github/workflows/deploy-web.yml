name: Deploy Web to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Restore or create .env
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_CONTENT" ]; then
            printf '%s\n' "$ENV_CONTENT" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web (Release)
        run: flutter build web --release

      - name: Ensure Cloudflare Pages SPA redirects
        run: |
          if [ -f web/_redirects ]; then
            cp web/_redirects build/web/_redirects
          else
            echo "/*    /index.html   200" > build/web/_redirects
          fi

      - name: Keep secrets out of the public build
        run: |
          # build/web is public and flutter_dotenv ships .env as assets/.env; the web app does not use the desktop OAuth client.
          if [ -f build/web/assets/.env ]; then
            grep -Ev '^[[:space:]]*GOOGLE_DESKTOP_CLIENT_(ID|SECRET)[[:space:]]*=' build/web/assets/.env > build/web/assets/.env.tmp || true
            mv -f build/web/assets/.env.tmp build/web/assets/.env
            if grep -Eq '^[[:space:]]*[A-Za-z0-9_]*(SECRET|PASSWORD|PRIVATE)[A-Za-z0-9_]*[[:space:]]*=' build/web/assets/.env; then
              echo "build/web/assets/.env still contains secret-looking keys; not deploying."
              exit 1
            fi
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-0583d4a5b3469cf89e54b33fd8d7f2a1}"
          npx wrangler pages deploy build/web --project-name=open-manga --branch=main --commit-dirty=true
