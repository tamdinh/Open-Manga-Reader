name: Build Android APKs

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Split APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore or create .env
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_CONTENT" ]; then
            printf '%s\n' "$ENV_CONTENT" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_CONTENT" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_CONTENT" > android/app/google-services.json
          fi

      - name: Restore debug.keystore for Google Sign-In
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > android/app/debug.keystore
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APKs per ABI (split-per-abi)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs to openmanga-<abi>.apk
        run: |
          cd build/app/outputs/flutter-apk
          for apk in app-*-release.apk; do
            if [ -f "$apk" ]; then
              # app-arm64-v8a-release.apk -> openmanga-arm64-v8a.apk
              new_name=$(echo "$apk" | sed -e 's/^app-/openmanga-/' -e 's/-release\.apk$/.apk/')
              mv "$apk" "$new_name"
              echo "Renamed $apk to $new_name"
            fi
          done

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/openmanga-*.apk
          if-no-files-found: error

      - name: Send APKs to Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        # Don't let a Telegram problem block the release step, but still show it as failed.
        continue-on-error: true
        run: |
          # Use HTML parse mode and escape the commit message: Markdown breaks on a
          # lone "_" or "*" (e.g. "cloud_firestore"), and Telegram then rejects the upload.
          html_escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          # Keep the caption well under Telegram's 1024-char limit.
          MSG="${COMMIT_MSG:0:600}"
          [ "${#COMMIT_MSG}" -gt 600 ] && MSG="${MSG}…"
          MSG_HTML=$(printf '%s' "$MSG" | html_escape)

          CAPTION=$(printf '✅ <b>Build thành công!</b>\n📱 <b>App:</b> Open-Manga-Reader\n🌿 <b>Branch:</b> <code>%s</code>\n🔖 <b>Commit:</b> <code>%s</code>\n📝 <b>Message:</b>\n%s' \
            "$REF_NAME" "$COMMIT_SHA" "$MSG_HTML")

          FAILED=0
          for apk in build/app/outputs/flutter-apk/openmanga-*.apk; do
            filename=$(basename "$apk")
            echo "Sending $filename to Telegram..."
            FILE_CAPTION=$(printf '📦 <b>%s</b>\n%s' "$filename" "$CAPTION")

            # --form-string stops curl from interpreting ';', '"' or '<' inside the caption.
            RESPONSE=$(curl -sS --max-time 300 \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"$apk" \
              --form-string caption="$FILE_CAPTION" \
              --form-string parse_mode="HTML" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument") || RESPONSE=""

            if echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "✔ Sent $filename"
            else
              echo "::error::Failed to send $filename to Telegram: $RESPONSE"
              FAILED=1
            fi
            sleep 2   # stay clear of Telegram's per-chat rate limit
          done

          exit $FAILED

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/openmanga-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
